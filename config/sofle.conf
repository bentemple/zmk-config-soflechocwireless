# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=250
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_DISPLAY_INVERT=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

# For split keyboards:
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Deep sleep after 15 min idle (ZMK default timeout); a key press on that half wakes it.
CONFIG_ZMK_SLEEP=y

# Halves talk over the TRRS cable only (no cable-detect pin, so no Bluetooth fallback).
CONFIG_ZMK_SPLIT_BLE=n
# Interrupt UART mode: async/DMA has a known RX bug on nRF52.
CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
